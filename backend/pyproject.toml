[project]
name = "backend"
version = "0.1.0"
description = "Weather Leverage API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "duckdb>=1.3.1",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "mcp>=1.30.0,<2",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-exporter-otlp>=1.25.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "opentelemetry-sdk>=1.25.0",
  "prometheus-client>=0.20.0",
  "pydantic>=2.11.7",
  "redis>=5.0.0",
  "sentry-sdk>=2.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "black>=24.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "black>=24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"admin.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]