[project]
name = "backend"
version = "0.1.0"
description = "Weather Leverage API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3.1",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "pydantic>=2.11.7",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "black>=24.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "black>=24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]